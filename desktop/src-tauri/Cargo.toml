[package]
name = "uni-deer-desktop"
version = "2.1.0"
description = "UniDeer desktop shell (Tauri v2)"
authors = ["UniDeer contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# This feature is used by `tauri build` for production builds.
custom-protocol = ["tauri/custom-protocol"]
